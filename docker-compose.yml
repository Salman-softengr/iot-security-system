version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - iot-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - iot-network

  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-iot_security}
    ports:
      - "5432:5432"
    volumes:
      - ./orchestrator/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iot-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - iot-network

  edge:
    build: ./edge
    depends_on:
      - kafka
    env_file: .env
    network_mode: host # Needed for Scapy sniffing, though simulation mode can use bridge
    # networks:
    #   - iot-network

  inference:
    build: ./inference
    depends_on:
      - kafka
      - postgres
    env_file: .env
    networks:
      - iot-network

  orchestrator:
    build: ./orchestrator
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    env_file: .env
    networks:
      - iot-network

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge

volumes:
  postgres_data:
